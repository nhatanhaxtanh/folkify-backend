server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/folkify}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket-name: ${R2_BUCKET_NAME}
  public-url: ${R2_PUBLIC_URL}

pay2s:
  api-url: ${PAY2S_API_URL:https://payment.pay2s.vn/v1/gateway/api/create}
  partner-code: ${PAY2S_PARTNER_CODE:}
  partner-name: ${PAY2S_PARTNER_NAME:Folkify}
  access-key: ${PAY2S_ACCESS_KEY:}
  secret-key: ${PAY2S_SECRET_KEY:}
  ipn-url: ${PAY2S_IPN_URL:http://localhost:8080/api/payments/webhooks/pay2s}
  redirect-url: ${PAY2S_REDIRECT_URL:http://localhost:8080/api/payments/result}
  verify-webhook-signature: ${PAY2S_VERIFY_WEBHOOK:false}
  bank:
    account-number: ${PAY2S_BANK_ACCOUNT_NUMBER:}
    bank-id: ${PAY2S_BANK_ID:}
    account-holder: ${PAY2S_BANK_ACCOUNT_HOLDER:}
  plan-prices:
    BASIC: ${PAY2S_PRICE_BASIC:99000}
    PRO: ${PAY2S_PRICE_PRO:199000}

app:
  jwt:
    secret: ${JWT_SECRET:folkify-super-secret-key-change-this-in-production-must-be-256-bits}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  mail:
    from: ${MAIL_FROM:noreply@folkify.vn}
  reset-password:
    expiration: ${RESET_PASSWORD_EXPIRATION:3600000}
  base-url: ${BASE_URL:http://localhost:8080}
  deep-link:
    base-url: ${DEEP_LINK_BASE_URL:folkify:///reset-password}
