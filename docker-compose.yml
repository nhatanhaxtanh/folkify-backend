services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: folkify
      POSTGRES_USER: folkify
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folkify"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/folkify
      DB_USERNAME: folkify
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      BASE_URL: ${BASE_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      PAY2S_API_URL: ${PAY2S_API_URL:-https://payment.pay2s.vn/v1/gateway/api/create}
      PAY2S_PARTNER_CODE: ${PAY2S_PARTNER_CODE}
      PAY2S_ACCESS_KEY: ${PAY2S_ACCESS_KEY}
      PAY2S_SECRET_KEY: ${PAY2S_SECRET_KEY}
      PAY2S_IPN_URL: ${PAY2S_IPN_URL}
      PAY2S_REDIRECT_URL: ${PAY2S_REDIRECT_URL}
      PAY2S_BANK_ACCOUNT_NUMBER: ${PAY2S_BANK_ACCOUNT_NUMBER}
      PAY2S_BANK_ID: ${PAY2S_BANK_ID}
      PAY2S_BANK_ACCOUNT_HOLDER: ${PAY2S_BANK_ACCOUNT_HOLDER}
      PAY2S_PRICE_BASIC: ${PAY2S_PRICE_BASIC}
      PAY2S_PRICE_PRO: ${PAY2S_PRICE_PRO}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
